<svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-labelledby="title description">
  <title id="title">Dev Room terminal</title>
  <desc id="description">A black terminal window with green Matrix-inspired text welcoming visitors to Allen's dev room.</desc>

  <defs>
    <linearGradient id="terminal-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff14" stop-opacity=".16" />
      <stop offset=".55" stop-color="#39ff14" stop-opacity=".03" />
      <stop offset="1" stop-color="#050805" stop-opacity="0" />
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#39ff14" stroke-opacity=".035" />
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="918" height="178" rx="10" fill="#050805" stroke="#1b6b2b" stroke-width="2" />
  <rect x="1" y="1" width="918" height="178" rx="10" fill="url(#terminal-glow)" />
  <rect x="1" y="1" width="918" height="178" rx="10" fill="url(#scanlines)" />

  <path d="M1 34H919" stroke="#1b6b2b" />
  <circle cx="20" cy="18" r="4" fill="#39ff14" opacity=".42" />
  <circle cx="35" cy="18" r="4" fill="#39ff14" opacity=".68" />
  <circle cx="50" cy="18" r="4" fill="#39ff14" />
  <text x="460" y="23" fill="#74a67d" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">crousty24-bit@github: ~/dev-room</text>

  <g font-family="'Courier New', monospace">
    <text x="30" y="65" fill="#39ff14" font-size="15">+--[ crousty24-bit@github ]--[ ~/dev-room ]</text>
    <text x="30" y="96" fill="#b7ffaa" font-size="17">
      <tspan fill="#39ff14">$</tspan>
      <tspan> ./open-dev-room</tspan>
    </text>
    <text x="30" y="128" fill="#74a67d" font-size="14">Initializing developer profile ...</text>
    <text x="30" y="154" fill="#39ff14" font-size="15" filter="url(#glow)">ACCESS GRANTED</text>
    <rect x="176" y="141" width="9" height="16" fill="#39ff14">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <g fill="#39ff14" font-family="'Courier New', monospace" font-size="10" opacity=".13">
    <text x="795" y="56">01001</text>
    <text x="850" y="73">10110</text>
    <text x="815" y="93">00101</text>
    <text x="870" y="112">11001</text>
    <text x="790" y="133">10100</text>
    <text x="845" y="153">01101</text>
  </g>
</svg>
